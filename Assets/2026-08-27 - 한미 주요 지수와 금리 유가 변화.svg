  <rect x="0" y="-275" width="1200" height="1200" fill="#f8fafc"/>
  <text x="60" y="66" font-family="Apple SD Gothic Neo, sans-serif" font-size="31" font-weight="700" fill="#0f172a">2026-08-26: 지수는 거의 보합권, 금리·유가도 별도 확인</text>
