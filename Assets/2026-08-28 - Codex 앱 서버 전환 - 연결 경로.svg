<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex MCP 서버 명령 폐기와 앱 서버 전환</title>
  <desc id="desc">기존 codex mcp-server 명령과 권장되는 Codex 앱 서버 경로를 비교한 개념도다.</desc>
  <rect width="1200" height="560" fill="#FAFAFC"/>
  <text x="60" y="72" fill="#1E1B4B" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="34" font-weight="700" textLength="1060" lengthAdjust="spacingAndGlyphs">Codex 통합: 프로토콜과 제품 진입점을 구분하기</text>
  <text x="60" y="110" fill="#52606D" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="18">2026-08-24 공식 공지 기준. 제품별 인증·권한·설정은 실제 문서를 다시 확인한다.</text>
  <rect x="60" y="165" width="490" height="240" rx="20" fill="#FFF1F2" stroke="#E11D48" stroke-width="3"/>
  <text x="94" y="215" fill="#BE123C" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="25" font-weight="700">기존 명령 경로</text>
  <rect x="95" y="245" width="205" height="76" rx="12" fill="#FFFFFF"/><text x="127" y="291" fill="#334155" font-family="Arial, sans-serif" font-size="20">Client / tool</text>
  <path d="M300 283 H365" stroke="#E11D48" stroke-width="4" marker-end="url(#r)"/>
  <rect x="365" y="245" width="150" height="76" rx="12" fill="#FFFFFF"/><text x="385" y="278" fill="#BE123C" font-family="Arial, sans-serif" font-size="17" font-weight="700">codex</text><text x="382" y="302" fill="#BE123C" font-family="Arial, sans-serif" font-size="17" font-weight="700">mcp-server</text>
  <text x="95" y="365" fill="#BE123C" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="18">상태: deprecated — 새 설정의 권장 경로가 아님</text>
  <rect x="650" y="165" width="490" height="240" rx="20" fill="#ECFDF5" stroke="#16A34A" stroke-width="3"/>
  <text x="684" y="215" fill="#166534" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="25" font-weight="700">권장 진입점</text>
  <rect x="685" y="245" width="160" height="76" rx="12" fill="#FFFFFF"/><text x="712" y="291" fill="#334155" font-family="Arial, sans-serif" font-size="20">Client</text>
  <path d="M845 283 H910" stroke="#16A34A" stroke-width="4" marker-end="url(#g)"/>
  <rect x="910" y="245" width="195" height="76" rx="12" fill="#FFFFFF"/><text x="937" y="291" fill="#166534" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="20" font-weight="700">Codex 앱 서버</text>
  <text x="685" y="365" fill="#166534" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="18">확인: 통합별 지원 명령·인증·권한·도구 목록</text>
  <rect x="60" y="450" width="1080" height="58" rx="14" fill="#EEF2FF"/>
  <text x="90" y="487" fill="#3730A3" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="20" font-weight="700">MCP 자체의 종료를 뜻하지 않는다 → 기존 명령에 의존한 설정의 연결 경로를 점검한다.</text>
  <defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#E11D48"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/></marker></defs>
</svg>
