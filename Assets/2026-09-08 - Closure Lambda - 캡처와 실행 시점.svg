<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Swift Closure와 Kotlin Lambda의 캡처와 실행 시점</title>
  <desc id="desc">함수가 만들어질 때 바깥 값을 캡처하고, 나중에 실행하며, 값 타입과 참조 타입에서 관찰 결과가 달라질 수 있음을 나타낸다.</desc>
  <rect width="1200" height="720" fill="#0B0F14"/>
  <text x="64" y="76" fill="#F1F5F9" font-size="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">Closure / Lambda: 캡처와 실행 시점</text>
  <text x="64" y="114" fill="#94A3B8" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif">함수가 만들어진 시점과 호출되는 시점을 분리해 읽는다.</text>
  <rect x="64" y="176" width="306" height="318" rx="18" fill="#151B23" stroke="#38BDF8" stroke-width="2"/>
  <text x="94" y="226" fill="#7DD3FC" font-size="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">1. 바깥 문맥</text>
  <text x="94" y="276" fill="#E5E7EB" font-size="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif">값 · 객체 · self</text>
  <text x="94" y="316" fill="#CBD5E1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif">무엇을 잡는지 확인</text>
  <rect x="447" y="176" width="306" height="318" rx="18" fill="#151B23" stroke="#A78BFA" stroke-width="2"/>
  <text x="477" y="226" fill="#C4B5FD" font-size="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">2. 함수 생성</text>
  <text x="477" y="276" fill="#E5E7EB" font-size="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif">capture list / 캡처</text>
  <text x="477" y="316" fill="#CBD5E1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif">값인가 참조인가</text>
  <rect x="830" y="176" width="306" height="318" rx="18" fill="#151B23" stroke="#F59E0B" stroke-width="2"/>
  <text x="860" y="226" fill="#FCD34D" font-size="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">3. 나중에 호출</text>
  <text x="860" y="276" fill="#E5E7EB" font-size="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif">실행 시점의 관찰</text>
  <text x="860" y="316" fill="#CBD5E1" font-size="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif">수명 · 순환 참조 점검</text>
  <path d="M370 335 H425" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/><path d="M425 335 l-14 -10 v20z" fill="#38BDF8"/>
  <path d="M753 335 H808" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/><path d="M808 335 l-14 -10 v20z" fill="#A78BFA"/>
  <rect x="64" y="550" width="1072" height="100" rx="16" fill="#1F2937"/>
  <text x="94" y="591" fill="#F1F5F9" font-size="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">핵심 질문</text>
  <text x="94" y="625" fill="#CBD5E1" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif">“언제 실행되는가?”보다 먼저 “무엇을 어떤 방식으로 붙잡는가?”를 확인한다.</text>
</svg>
