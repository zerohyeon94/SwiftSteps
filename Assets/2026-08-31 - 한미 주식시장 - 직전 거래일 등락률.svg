<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">2026년 8월 28일 한국과 미국 주요 지수의 전 거래일 대비 등락률</title>
  <desc id="desc">코스피, 코스닥, S&amp;P 500, 나스닥 종합의 전 거래일 대비 비율을 표시하고 8월 29일과 30일은 새 정규장 종가가 없었다는 기준을 알려 주는 차트</desc>
  <rect width="1200" height="675" fill="#F7F8FA"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#202B38">직전 거래일 등락률 · 2026-08-28 정규장 종가</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="17" fill="#586572">8월 31일 KST 아침 기준 · 8월 29~30일은 새 한국·미국 현물시장 종가 없음</text>
  <text x="60" y="145" font-family="Arial, sans-serif" font-size="16" fill="#586572">비교 단위: 전 거래일 대비 등락률. 환율·국채수익률은 단위가 달라 차트에서 제외.</text>
