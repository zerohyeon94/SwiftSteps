<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Swift enum과 Kotlin sealed class의 상태 분기 구조</title>
  <desc id="desc">하나의 로딩 상태가 idle, loaded count, failed message로 갈라지는 두 언어의 표현을 비교한다.</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172554">제한된 상태를 표현하고 분기하기</text>
  <text x="600" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Swift enum과 Kotlin sealed class는 가능한 상태와 상태별 데이터를 코드에 드러낸다.</text>
  <rect x="70" y="150" width="490" height="455" rx="22" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <text x="315" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3730A3">Swift enum</text>
  <rect x="205" y="235" width="220" height="62" rx="14" fill="#4F46E5"/>
  <text x="315" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">LoadState</text>
  <path d="M315 297 L315 334 M315 334 L155 370 M315 334 L315 370 M315 334 L475 370" fill="none" stroke="#6366F1" stroke-width="4"/>
  <rect x="82" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="155" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#312E81">case idle</text>
  <text x="155" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">추가 데이터 없음</text>
  <rect x="242" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="315" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">case loaded</text>
  <text x="315" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">count: Int</text>
  <rect x="402" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/>
  <text x="475" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312E81">case failed</text>
  <text x="475" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">message: String</text>
  <text x="315" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#312E81">switch에서 case별로 처리</text>
  <rect x="640" y="150" width="490" height="455" rx="22" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="885" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#065F46">Kotlin sealed class</text>
  <rect x="775" y="235" width="220" height="62" rx="14" fill="#059669"/>
  <text x="885" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">LoadState</text>
  <path d="M885 297 L885 334 M885 334 L725 370 M885 334 L885 370 M885 334 L1045 370" fill="none" stroke="#10B981" stroke-width="4"/>
  <rect x="652" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="725" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065F46">data object</text>
  <text x="725" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Idle</text>
  <rect x="812" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="885" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065F46">data class</text>
  <text x="885" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Loaded(count)</text>
  <rect x="972" y="370" width="146" height="122" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="1045" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065F46">data class</text>
  <text x="1045" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Failed(message)</text>
  <text x="885" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#065F46">when에서 하위 타입별로 처리</text>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#64748B">개념도 · 실제 앱의 상태 수와 흐름은 도메인에 따라 달라질 수 있음</text>
</svg>
