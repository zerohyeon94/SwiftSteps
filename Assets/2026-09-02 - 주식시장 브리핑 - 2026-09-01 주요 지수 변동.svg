<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">2026년 9월 1일 주요 시장 변동</title>
  <desc id="desc">코스피와 코스닥, S&amp;P 500과 나스닥 종가 및 등락률을 비교하고 원달러 환율과 미국 10년물 국채수익률, 브렌트유의 변동을 제시하는 차트.</desc>
  <rect width="1400" height="760" fill="#0B0F14"/>
  <text x="60" y="73" fill="#F1F5F9" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700">2026-09-01 정규장 마감: 한국은 혼조, 미국은 유가·금리 경계로 하락</text>
  <text x="60" y="104" fill="#94A3B8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="15">종가와 일간 등락률 · 한국 원/달러 환율은 서울 외환시장 마감 · 미국 지수는 뉴욕 정규장 마감 기준</text>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <rect x="80" y="170" width="580" height="260" rx="22" fill="#151B23" stroke="#334155"/>
    <text x="120" y="218" fill="#CBD5E1" font-size="23" font-weight="700">한국</text>
    <text x="120" y="282" fill="#E5E7EB" font-size="24">KOSPI</text><text x="530" y="282" text-anchor="end" fill="#86EFAC" font-size="24" font-weight="700">6,835.80  +0.23%</text>
    <rect x="120" y="302" width="390" height="22" rx="11" fill="#1D4ED8"/><rect x="510" y="302" width="10" height="22" fill="#4ADE80"/>
    <text x="120" y="371" fill="#E5E7EB" font-size="24">KOSDAQ</text><text x="530" y="371" text-anchor="end" fill="#FCA5A5" font-size="24" font-weight="700">821.25  −1.56%</text>
    <rect x="120" y="391" width="260" height="22" rx="11" fill="#7F1D1D"/>
    <rect x="740" y="170" width="580" height="260" rx="22" fill="#151B23" stroke="#334155"/>
    <text x="780" y="218" fill="#CBD5E1" font-size="23" font-weight="700">미국</text>
    <text x="780" y="282" fill="#E5E7EB" font-size="24">S&amp;P 500</text><text x="1190" y="282" text-anchor="end" fill="#FCA5A5" font-size="24" font-weight="700">7,631.47  −0.7%</text>
    <rect x="780" y="302" width="300" height="22" rx="11" fill="#7F1D1D"/>
    <text x="780" y="371" fill="#E5E7EB" font-size="24">Nasdaq</text><text x="1190" y="371" text-anchor="end" fill="#FCA5A5" font-size="24" font-weight="700">26,099.77  −1.0%</text>
    <rect x="780" y="391" width="390" height="22" rx="11" fill="#7F1D1D"/>
  </g>
  <rect x="80" y="510" width="1240" height="138" rx="22" fill="#151B23" stroke="#334155"/>
  <text x="125" y="553" fill="#FDE68A" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700">변동성 설명 지표</text>
  <text x="125" y="599" fill="#CBD5E1" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="20">원/달러 1,370.4원 (+1.8원)  ·  브렌트유 +4.6%  ·  미국 10년물 국채수익률 4.79%</text>
  <text x="125" y="628" fill="#94A3B8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16">출처 기준: Newsis(한국 정규장·환율), AP(미국 정규장·브렌트유·미국 10년물). 지수 간 절대 규모는 서로 비교하지 않는다.</text>
