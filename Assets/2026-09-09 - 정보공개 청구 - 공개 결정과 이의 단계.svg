<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" role="img" aria-labelledby="title desc">
  <title id="title">대한민국 정보공개 청구의 처리 흐름</title>
  <desc id="desc">공개 정보 확인, 구체적 청구, 기관 결정, 공개 또는 부분공개와 구제 절차를 잇는 개념도</desc>
  <rect width="720" height="432" fill="#0B0F14"/>
  <text x="40" y="48" fill="#F1F5F9" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="24" font-weight="700">‘질문’이 아니라 기관이 보유한 ‘기록’을 청구한다</text>
  <text x="40" y="77" fill="#94A3B8" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="14">정보공개 제도의 기본 흐름 · 실제 대상·기한·수수료는 해당 기관 안내가 최종 기준</text>
  <g font-family="Apple SD Gothic Neo, Arial, sans-serif">
    <rect x="45" y="157" width="136" height="78" rx="12" fill="#172033" stroke="#38BDF8"/>
    <text x="67" y="187" fill="#E5E7EB" font-size="17" font-weight="700">사전 공개 확인</text><text x="66" y="211" fill="#94A3B8" font-size="13">이미 공개된 자료?</text>
    <path d="M181 196 H223" stroke="#64748B" stroke-width="4"/><path d="M213 190 L223 196 L213 202" stroke="#64748B" stroke-width="4" fill="none"/>
    <rect x="223" y="157" width="136" height="78" rx="12" fill="#172033" stroke="#A78BFA"/>
    <text x="247" y="187" fill="#E5E7EB" font-size="17" font-weight="700">구체적 청구</text><text x="244" y="211" fill="#D8CCFF" font-size="13">기간 · 문서 · 형식</text>
    <path d="M359 196 H401" stroke="#64748B" stroke-width="4"/><path d="M391 190 L401 196 L391 202" stroke="#64748B" stroke-width="4" fill="none"/>
    <rect x="401" y="157" width="136" height="78" rx="12" fill="#172033" stroke="#22C7B8"/>
    <text x="426" y="187" fill="#E5E7EB" font-size="17" font-weight="700">기관의 결정</text><text x="430" y="211" fill="#B7F5EA" font-size="13">공개 범위 판단</text>
    <path d="M537 178 H587 M537 214 H587" stroke="#64748B" stroke-width="3"/>
    <rect x="587" y="126" width="93" height="51" rx="10" fill="#17352F" stroke="#22C7B8"/>
    <text x="613" y="157" fill="#D1FAE5" font-size="15" font-weight="700">공개</text>
    <rect x="587" y="202" width="93" height="51" rx="10" fill="#3A2830" stroke="#F59E0B"/>
    <text x="598" y="233" fill="#FDE68A" font-size="14" font-weight="700">부분·비공개</text>
    <path d="M633 253 V310 H454" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <rect x="264" y="285" width="190" height="53" rx="10" fill="#2A1D16" stroke="#F97316"/>
    <text x="291" y="317" fill="#FCD5B4" font-size="15">사유 확인 · 이의·구제 절차</text>
  </g>
  <text x="40" y="407" fill="#94A3B8" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="13">개인정보·안전·진행 중 업무 등 법정 비공개 사유는 개별 기록과 법 조항을 기준으로 판단한다.</text>
</svg>
