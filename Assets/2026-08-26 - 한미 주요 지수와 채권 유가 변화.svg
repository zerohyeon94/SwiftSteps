  <text x="70" y="68" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#18324b">2026-08-25: 한국·미국 주가지수는 상승, 유가·미 10년물은 하락</text>
