  <text x="125" y="603" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#264653">별도 지표: 브렌트유 $87.27 (−3.6%), 미 10년물 4.63% (전일 4.70%). 단위가 달라 막대에 함께 그리지 않았다.</text>
