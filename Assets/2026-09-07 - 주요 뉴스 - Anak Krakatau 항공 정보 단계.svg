<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Anak Krakatau 화산재 항공 정보의 확인 단계</title>
  <desc id="desc">공식 확인 사실, 수시 변경 운항 조치, 미확정 후속 영향을 구분하는 뉴스 검증 도식</desc>
  <rect width="600" height="600" fill="#0B0F14"/>
  <rect x="24" y="22" width="552" height="88" rx="16" fill="#151B23" stroke="#334155"/>
  <text x="46" y="58" fill="#F1F5F9" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700">Anak Krakatau: 항공 정보 3단계</text>
  <text x="46" y="85" fill="#94A3B8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="14">현장 재현이 아닌 사실·조치·미확정 범위 도식</text>
  <g font-family="Arial, Apple SD Gothic Neo, sans-serif">
    <rect x="24" y="136" width="552" height="119" rx="16" fill="#151B23" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="59" cy="171" r="18" fill="#075985"/><text x="53" y="177" fill="#E0F2FE" font-size="17" font-weight="700">A</text>
    <text x="91" y="177" fill="#F1F5F9" font-size="20" font-weight="700">공식 확인 사실</text>
    <text x="48" y="214" fill="#CBD5E1" font-size="16">화산 활동·화산재 감시, 9월 6일 SIGMET 발령과 항공 영향 감시 발표</text>
    <text x="48" y="239" fill="#7DD3FC" font-size="14">근거: BMKG 공식 보도자료</text>
    <path d="M300 265 V278" stroke="#64748B" stroke-width="4"/><path d="M292 272 L300 280 L308 272" fill="none" stroke="#64748B" stroke-width="4"/>
    <rect x="24" y="290" width="552" height="119" rx="16" fill="#151B23" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="59" cy="325" r="18" fill="#92400E"/><text x="53" y="331" fill="#FEF3C7" font-size="17" font-weight="700">B</text>
    <text x="91" y="331" fill="#F1F5F9" font-size="20" font-weight="700">수시로 바뀌는 운항 조치</text>
    <text x="48" y="368" fill="#CBD5E1" font-size="16">공항 임시 중단·재개는 시각·공항별로 달라져 NOTAM·항공사 안내를 확인</text>
    <text x="48" y="393" fill="#FCD34D" font-size="14">근거: 정부·항공 기상 공지</text>
    <path d="M300 419 V432" stroke="#64748B" stroke-width="4"/><path d="M292 426 L300 434 L308 426" fill="none" stroke="#64748B" stroke-width="4"/>
    <rect x="24" y="444" width="552" height="119" rx="16" fill="#151B23" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="59" cy="479" r="18" fill="#6D28D9"/><text x="53" y="485" fill="#F5F3FF" font-size="17" font-weight="700">C</text>
    <text x="91" y="485" fill="#F1F5F9" font-size="20" font-weight="700">아직 단정할 수 없는 영향</text>
    <text x="48" y="522" fill="#CBD5E1" font-size="16">활동 지속 기간·장기 결항·피해·복구의 최종 범위는 후속 공식 발표로 확인</text>
    <text x="48" y="547" fill="#C4B5FD" font-size="14">예측과 관측 사실을 한 문장에 섞지 않기</text>
  </g>
  <text x="30" y="586" fill="#94A3B8" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="12">기준: 2026-09-06 인도네시아 기관 공지 · 실제 이동은 당일 항공사·공항 안내</text>
</svg>
