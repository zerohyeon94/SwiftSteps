<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 19px; fill: #526079; }
      .h2 { font-size: 25px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #526079; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2a4a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68758d"/></marker>
  </defs>
  <rect width="1200" height="700" rx="30" fill="#f6f8fc"/>
  <text x="60" y="68" class="title">Swift·Kotlin 컬렉션 조회 비교</text>
  <text x="60" y="102" class="subtitle">순서로 찾을 때와 키로 찾을 때, 값 없음의 경계를 구분한다</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="535" height="450" rx="24" fill="#ffffff" stroke="#d8e1f0"/>
    <rect x="610" y="135" width="535" height="450" rx="24" fill="#ffffff" stroke="#d8e1f0"/>
  </g>
  <rect x="55" y="135" width="535" height="62" rx="24" fill="#e9f0ff"/>
  <rect x="610" y="135" width="535" height="62" rx="24" fill="#efeaff"/>
  <text x="88" y="176" class="h2" fill="#2458a6">Swift</text>
  <text x="643" y="176" class="h2" fill="#6d47b5">Kotlin</text>

  <text x="88" y="235" class="label">Array — 인덱스로 조회</text>
  <g>
    <rect x="88" y="255" width="135" height="58" rx="12" fill="#f0f5ff" stroke="#aac1eb"/><text x="105" y="280" class="small">[0]</text><text x="138" y="294" class="body">Seoul</text>
    <rect x="235" y="255" width="135" height="58" rx="12" fill="#f0f5ff" stroke="#aac1eb"/><text x="252" y="280" class="small">[1]</text><text x="285" y="294" class="body">Prague</text>
    <rect x="382" y="255" width="135" height="58" rx="12" fill="#f0f5ff" stroke="#aac1eb"/><text x="399" y="280" class="small">[2]</text><text x="432" y="294" class="body">Vienna</text>
  </g>
  <text x="88" y="346" class="small">범위 밖 [3] → 런타임 오류 가능</text>

  <text x="88" y="402" class="label">Dictionary — 키로 조회</text>
  <rect x="88" y="420" width="430" height="68" rx="14" fill="#f7f9fd" stroke="#cbd5e5"/>
  <text x="108" y="448" class="body">"Prague"</text><line x1="205" y1="452" x2="288" y2="452" stroke="#68758d" stroke-width="2" marker-end="url(#arrow)"/><text x="308" y="448" class="body">"Praha hl.n."</text>
  <text x="108" y="477" class="small">없는 키 → Value? → if let / ??</text>
  <rect x="88" y="515" width="430" height="44" rx="12" fill="#fff6dc"/><text x="108" y="543" class="small">let: 컬렉션 구조 고정 · var: 추가·삭제 가능</text>

  <text x="643" y="235" class="label">List — 인덱스로 조회</text>
  <g>
    <rect x="643" y="255" width="135" height="58" rx="12" fill="#f4f0ff" stroke="#c2afea"/><text x="660" y="280" class="small">[0]</text><text x="693" y="294" class="body">Seoul</text>
    <rect x="790" y="255" width="135" height="58" rx="12" fill="#f4f0ff" stroke="#c2afea"/><text x="807" y="280" class="small">[1]</text><text x="840" y="294" class="body">Prague</text>
    <rect x="937" y="255" width="135" height="58" rx="12" fill="#f4f0ff" stroke="#c2afea"/><text x="954" y="280" class="small">[2]</text><text x="987" y="294" class="body">Vienna</text>
  </g>
  <text x="643" y="346" class="small">getOrNull(3) → null · [3]은 예외 가능</text>

  <text x="643" y="402" class="label">Map — 키로 조회</text>
  <rect x="643" y="420" width="430" height="68" rx="14" fill="#f7f9fd" stroke="#cbd5e5"/>
  <text x="663" y="448" class="body">"Prague"</text><line x1="760" y1="452" x2="843" y2="452" stroke="#68758d" stroke-width="2" marker-end="url(#arrow)"/><text x="863" y="448" class="body">"Praha hl.n."</text>
  <text x="663" y="477" class="small">없는 키 → Value? → ?: 로 기본값</text>
  <rect x="643" y="515" width="430" height="44" rx="12" fill="#fff6dc"/><text x="663" y="543" class="small">val: 재대입 방지 · List / MutableList는 별도 구분</text>

  <rect x="55" y="610" width="1090" height="55" rx="16" fill="#eaf7f1" stroke="#b8decf"/>
  <text x="82" y="644" class="body">핵심: 인덱스는 범위를 전제로 하고, 키 조회는 값이 없을 가능성을 Optional·nullable로 드러낸다.</text>
</svg>
