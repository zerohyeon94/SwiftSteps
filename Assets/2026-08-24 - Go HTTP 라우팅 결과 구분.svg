<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #172033; }
      .title { font-size: 36px; font-weight: 750; }.subtitle { font-size: 19px; fill: #526079; }.h2 { font-size: 24px; font-weight: 700; }.body { font-size: 18px; }.small { font-size: 15px; fill: #526079; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2a4a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758f"/></marker>
  </defs>
  <rect width="1200" height="650" rx="30" fill="#f6f8fc"/>
  <text x="60" y="68" class="title">Go HTTP 요청은 어디에서 갈라지는가</text>
  <text x="60" y="103" class="subtitle">연결 실패, 라우팅 실패(404), 정상 응답(200)은 서로 다른 단계의 결과다</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="220" height="120" rx="22" fill="#ffffff" stroke="#d5deec"/>
    <rect x="360" y="170" width="220" height="120" rx="22" fill="#ffffff" stroke="#d5deec"/>
    <rect x="665" y="170" width="220" height="120" rx="22" fill="#ffffff" stroke="#d5deec"/>
  </g>
  <text x="90" y="215" class="h2">curl 클라이언트</text><text x="90" y="250" class="mono">localhost:8080</text>
  <text x="400" y="215" class="h2">Go http.Server</text><text x="400" y="250" class="small">포트 8080에서 수신</text>
  <text x="710" y="215" class="h2">ServeMux</text><text x="710" y="250" class="small">메서드 + 경로 매칭</text>
  <line x1="275" y1="230" x2="360" y2="230" stroke="#66758f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="230" x2="665" y2="230" stroke="#66758f" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M885 215 C960 215 930 355 1000 355" fill="none" stroke="#25845e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M885 250 C960 250 930 500 1000 500" fill="none" stroke="#c4752b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="955" y="310" width="200" height="95" rx="18" fill="#e8f7f0" stroke="#a9d8c4"/>
  <text x="984" y="344" class="mono">GET /health</text><text x="984" y="378" class="h2" fill="#1b7854">200 JSON</text>
  <rect x="955" y="455" width="200" height="95" rx="18" fill="#fff1e4" stroke="#e7c39f"/>
  <text x="984" y="489" class="mono">GET /missing</text><text x="984" y="523" class="h2" fill="#ad5a1f">404 Not Found</text>

  <rect x="55" y="365" width="660" height="170" rx="22" fill="#fff" stroke="#d5deec" filter="url(#shadow)"/>
  <circle cx="105" cy="416" r="21" fill="#d95757"/><text x="97" y="424" class="h2" fill="#ffffff">!</text>
  <text x="145" y="410" class="h2">서버가 포트를 듣지 않으면</text>
  <text x="145" y="448" class="body">요청은 ServeMux까지 도달하지 못하고 연결 실패가 된다.</text>
  <text x="145" y="482" class="small">먼저 프로세스 실행 여부 · 포트 일치 · 포트 점유를 확인</text>
  <line x1="165" y1="290" x2="165" y2="365" stroke="#d95757" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="55" y="575" width="1100" height="45" rx="14" fill="#eaf0fb"/><text x="80" y="604" class="body">오늘의 경계: React와 PostgreSQL은 아직 연결하지 않고, Go 서버·라우팅·HTTP 결과만 검증한다.</text>
</svg>
