<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 -290 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI 생성 텍스트 워터마크가 말할 수 있는 것과 말할 수 없는 것</title>
  <desc id="desc">생성 또는 편집 신호는 모델 관여 가능성을 나타낼 수 있지만, 저작자와 소유권을 증명하지는 않는다는 흐름도.</desc>
  <rect x="0" y="-290" width="1200" height="1200" fill="#f8fafc"/>
  <text x="60" y="68" font-family="Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="700" fill="#172554">AI 생성 텍스트 워터마크: 증거의 범위는 어디까지인가</text>
  <text x="60" y="104" font-family="Apple SD Gothic Neo, sans-serif" font-size="18" fill="#475569">제공사 설명을 ‘판정 도구’가 아니라 출처 검토 과정의 한 신호로 읽는다.</text>
  <g font-family="Apple SD Gothic Neo, sans-serif" text-anchor="middle">
    <rect x="60" y="190" width="220" height="150" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="245" font-size="25" font-weight="700" fill="#1e3a8a">생성·편집 출력</text>
    <text x="170" y="284" font-size="18" fill="#334155">모델이 텍스트 처리</text>
    <text x="170" y="312" font-size="18" fill="#334155">또는 번역에 관여</text>
    <path d="M300 265 L355 265" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="375" y="190" width="220" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="485" y="245" font-size="25" font-weight="700" fill="#166534">워터마크 확인</text>
    <text x="485" y="284" font-size="18" fill="#334155">모델 관여의</text>
    <text x="485" y="312" font-size="18" fill="#334155">가능성 신호</text>
    <path d="M615 265 L670 265" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="690" y="190" width="220" height="150" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="800" y="245" font-size="25" font-weight="700" fill="#92400e">추가 검토</text>
    <text x="800" y="284" font-size="18" fill="#334155">출처·수정 이력·</text>
    <text x="800" y="312" font-size="18" fill="#334155">사람의 검토 기록</text>
    <path d="M930 265 L985 265" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1005" y="190" width="135" height="150" rx="20" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="1072" y="246" font-size="22" font-weight="700" fill="#6b21a8">사용 판단</text>
    <text x="1072" y="284" font-size="17" fill="#334155">정책·위험</text>
    <text x="1072" y="312" font-size="17" fill="#334155">검토</text>
  </g>
  <g font-family="Apple SD Gothic Neo, sans-serif">
    <rect x="60" y="410" width="510" height="130" rx="16" fill="#ecfdf5"/>
    <text x="90" y="454" font-size="22" font-weight="700" fill="#065f46">확인 신호가 지지하는 범위</text>
    <text x="90" y="494" font-size="18" fill="#334155">“해당 모델이 어느 시점에 출력에 관여했을 가능성”</text>
    <rect x="630" y="410" width="510" height="130" rx="16" fill="#fef2f2"/>
    <text x="660" y="454" font-size="22" font-weight="700" fill="#991b1b">확인 신호만으로 결론 낼 수 없는 것</text>
    <text x="660" y="494" font-size="18" fill="#334155">저작자·소유권·법적 책임·사람의 실제 기여도</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
