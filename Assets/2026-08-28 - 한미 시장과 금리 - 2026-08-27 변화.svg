<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">2026년 8월 27일 한국과 미국 시장 지수 및 금리 변화</title>
  <desc id="desc">코스피, 코스닥, S&amp;P 500, 다우, 나스닥의 전일 대비 등락률과 한국 기준금리 및 미국 10년물의 수준 변화를 표시한 차트다.</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <text x="60" y="66" fill="#0F172A" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="32" font-weight="700" textLength="1060" lengthAdjust="spacingAndGlyphs">2026-08-27 시장 변화: 주가지수 상승과 금리·유가 변수는 분리해서 읽기</text>
  <text x="60" y="102" fill="#52606D" font-family="Apple SD Gothic Neo, Arial, sans-serif" font-size="18">주가지수는 전일 대비 %, 금리는 기준일 수준과 변화 폭. 한국 정규장과 미국 정규장 마감 기준.</text>
