<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">비엔나 야간 교통: U-Bahn과 NightLine의 시간 경계</title><desc id="desc">평일 자정 전후, 금요일과 토요일 밤, 매일 NightLine 버스를 구분하는 개념도</desc>
  <rect width="1440" height="860" fill="#0B0F14"/><rect x="56" y="50" width="1328" height="108" rx="22" fill="#151B23" stroke="#334155"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif"><text x="94" y="98" fill="#F1F5F9" font-size="34" font-weight="700">비엔나 야간 이동: 같은 ‘밤’도 운행 체계가 다르다</text><text x="94" y="133" fill="#A5B4C7" font-size="20">일반 시간 · 주말 U-Bahn · NightLine · 당일 시간표를 분리해 확인</text>
  <line x1="152" y1="632" x2="1288" y2="632" stroke="#64748B" stroke-width="3"/><text x="128" y="684" fill="#94A3B8" font-size="20">05:00</text><text x="418" y="684" fill="#94A3B8" font-size="20">자정</text><text x="696" y="684" fill="#94A3B8" font-size="20">00:30</text><text x="1164" y="684" fill="#94A3B8" font-size="20">05:00</text>
  <rect x="154" y="307" width="1050" height="78" rx="16" fill="#1D4ED8"/><text x="184" y="357" fill="#F8FAFC" font-size="26" font-weight="700">일반 U-Bahn: 약 05:00 → 자정</text><text x="1230" y="357" fill="#93C5FD" font-size="20" text-anchor="end">개별 노선 시간표 확인</text>
  <rect x="454" y="431" width="730" height="78" rx="16" fill="#0F766E"/><text x="484" y="481" fill="#ECFEFF" font-size="25" font-weight="700">U-Bahn 24시간 · 약 15분 간격</text>
  <rect x="710" y="555" width="470" height="54" rx="14" fill="#7C3AED"/><text x="945" y="591" fill="#F5F3FF" font-size="23" font-weight="700" text-anchor="middle">NightLine: 매일 00:30 → 05:00</text>
  <rect x="56" y="730" width="1328" height="82" rx="18" fill="#1F2937"/><text x="88" y="779" fill="#FBBF24" font-size="23" font-weight="700">확인 순서</text><text x="248" y="779" fill="#E5E7EB" font-size="22">날짜 조건 → U-Bahn 또는 NightLine → 해당 노선의 당일 공지</text></g>
</svg>
