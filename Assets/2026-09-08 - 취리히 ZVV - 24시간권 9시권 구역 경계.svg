<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">취리히 ZVV 24시간권과 9시 이후 일일권의 시간과 구역 경계</title>
  <desc id="desc">24시간권과 9 O Clock day pass의 유효 시간 및 Zürich zone 110의 이중 구역 계산을 비교한다.</desc>
  <rect width="1200" height="720" fill="#0B0F14"/>
  <text x="64" y="76" fill="#F1F5F9" font-size="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">ZVV 일일권: 시간 창과 구역 계산을 따로 읽기</text>
  <text x="64" y="114" fill="#94A3B8" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif">구매 시각 · 선택 구역 · 도시 구역의 이중 계산은 서로 다른 정보다.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="64" y="176" width="510" height="330" rx="18" fill="#151B23" stroke="#38BDF8" stroke-width="2"/>
    <text x="96" y="230" fill="#7DD3FC" font-size="26" font-weight="700">24h-Ticket</text><text x="96" y="273" fill="#E5E7EB" font-size="20">선택한 구역 안에서 24시간</text>
    <line x1="96" y1="335" x2="530" y2="335" stroke="#334155" stroke-width="8" stroke-linecap="round"/><circle cx="150" cy="335" r="12" fill="#38BDF8"/><circle cx="476" cy="335" r="12" fill="#38BDF8"/>
    <text x="116" y="382" fill="#CBD5E1" font-size="18">구매·시작</text><text x="428" y="382" fill="#CBD5E1" font-size="18">+24시간</text><text x="96" y="448" fill="#94A3B8" font-size="17">유효 구역은 표·앱에서 다시 확인</text>
    <rect x="626" y="176" width="510" height="330" rx="18" fill="#151B23" stroke="#F59E0B" stroke-width="2"/>
    <text x="658" y="230" fill="#FCD34D" font-size="26" font-weight="700">9 O'Clock day pass</text><text x="658" y="273" fill="#E5E7EB" font-size="20">평일 09:00 → 다음 날 05:00</text>
    <line x1="658" y1="335" x2="1092" y2="335" stroke="#334155" stroke-width="8" stroke-linecap="round"/><circle cx="710" cy="335" r="12" fill="#F59E0B"/><circle cx="1038" cy="335" r="12" fill="#F59E0B"/>
    <text x="680" y="382" fill="#CBD5E1" font-size="18">09:00</text><text x="985" y="382" fill="#CBD5E1" font-size="18">다음 날 05:00</text><text x="658" y="448" fill="#94A3B8" font-size="17">주말·공휴일은 종일 유효 / all zones</text>
    <rect x="64" y="560" width="1072" height="90" rx="16" fill="#1F2937"/>
    <text x="94" y="597" fill="#C4B5FD" font-size="21" font-weight="700">Zürich zone 110</text><text x="94" y="630" fill="#E5E7EB" font-size="19">밀집 교통망 때문에 구역 수 계산에서 2개 구역으로 센다. 출발지·목적지와 실제 표의 범위를 확인한다.</text>
  </g>
</svg>
