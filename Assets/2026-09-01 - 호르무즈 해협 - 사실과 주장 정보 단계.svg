<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">호르무즈 해협 재충돌 정보 단계</title>
  <desc id="desc">공식 발표, 당사자 주장, 계속 확인할 결과를 나누어 보여 주는 정보 상태 도식</desc>
  <rect width="1400" height="800" fill="#f5f7fa"/>
  <rect x="48" y="40" width="1304" height="710" rx="28" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>
  <text x="96" y="110" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="700" fill="#243342">호르무즈 해협 재충돌: 발표 주체별 정보 단계</text>
  <text x="96" y="149" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="20" fill="#607080">사실 재현이 아닌 정보 상태 도식 · 2026-09-01 KST 기준</text>
  <rect x="100" y="205" width="370" height="430" rx="24" fill="#e3f0e8"/>
  <rect x="515" y="205" width="370" height="430" rx="24" fill="#fff2d9"/>
  <rect x="930" y="205" width="370" height="430" rx="24" fill="#e8edf7"/>
  <circle cx="285" cy="265" r="34" fill="#36805d"/>
  <text x="285" y="276" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="700" fill="#ffffff">1</text>
  <circle cx="700" cy="265" r="34" fill="#c98322"/>
  <text x="700" y="276" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="700" fill="#ffffff">2</text>
  <circle cx="1115" cy="265" r="34" fill="#566ea8"/>
  <text x="1115" y="276" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="700" fill="#ffffff">3</text>
  <text x="285" y="334" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700" fill="#25543f">공식 발표</text>
  <text x="285" y="379" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#25543f">미군: 발사대 타격 발표</text>
  <text x="285" y="417" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#25543f">요르단군: 미사일 8기 요격 발표</text>
  <text x="285" y="455" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#25543f">UAE: 드론 탐지·대응 발표</text>
  <text x="285" y="545" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#25543f">무엇이 발표됐는지는 확인 가능</text>
  <text x="700" y="334" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700" fill="#805311">당사자 주장</text>
  <text x="700" y="379" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#805311">표적의 위협 성격</text>
  <text x="700" y="417" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#805311">피해·보복·행동의 정당성</text>
  <text x="700" y="455" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#805311">협상 조건과 책임 소재</text>
  <text x="700" y="545" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#805311">주장과 독립 검증은 구분</text>
  <text x="1115" y="334" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="700" fill="#40588b">계속 확인할 결과</text>
  <text x="1115" y="379" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#40588b">최종 피해와 추가 충돌</text>
  <text x="1115" y="417" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#40588b">민간 항행의 실제 회복</text>
  <text x="1115" y="455" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="19" fill="#40588b">협상·합의의 문서화</text>
  <text x="1115" y="545" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#40588b">나중에 공식·독립 자료로 확인</text>
  <path d="M470 420 L505 420" stroke="#8795a5" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M885 420 L920 420" stroke="#8795a5" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8795a5"/></marker></defs>
  <text x="700" y="702" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="20" fill="#4d5d6c">한 사건에서도 발표된 조치 · 각국의 주장 · 장기 결과를 한 문장에 섞지 않는다.</text>
</svg>
