<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WHO 폴리오 IHR 비상위원회 결론을 읽는 정보 층위</title>
  <desc id="desc">자료 기준일, 위원회 판단, 임시 권고의 차이를 보이는 네 단계 흐름도</desc>
  <rect width="1200" height="630" fill="#fbfcfe"/>
  <text x="70" y="72" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700" fill="#1d3557">WHO 폴리오 IHR 결론: 발표일·자료 기준일·판단·권고를 나누어 읽기</text>
  <text x="70" y="108" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="18" fill="#52687d">2026년 8월 25일 WHO 성명 · 감염 위험의 국제적 확산에 관한 정보 구조</text>
  <path d="M265 285 H350 M535 285 H620 M805 285 H890" stroke="#7997b3" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7997b3"/></marker></defs>
  <rect x="55" y="185" width="210" height="205" rx="22" fill="#dbeafe" stroke="#3b82b6" stroke-width="2"/>
  <text x="88" y="238" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#174d7a">1. 성명 공개</text>
  <text x="85" y="280" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#1f3548">8월 25일</text>
  <text x="85" y="316" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">WHO가 위원회</text>
  <text x="85" y="348" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">성명을 공개</text>
  <rect x="350" y="185" width="185" height="205" rx="22" fill="#e9f8ef" stroke="#2f855a" stroke-width="2"/>
  <text x="381" y="238" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#1d6b45">2. 자료 범위</text>
  <text x="382" y="280" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#1f3548">4월 30일</text>
  <text x="382" y="316" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">감시·사례 자료</text>
  <text x="382" y="348" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">기준일</text>
  <rect x="620" y="185" width="185" height="205" rx="22" fill="#fff3d9" stroke="#d28b1e" stroke-width="2"/>
  <text x="651" y="238" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#965b08">3. 위원회 판단</text>
  <text x="651" y="280" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">PHEIC 유지</text>
  <text x="651" y="316" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">팬데믹 비상은</text>
  <text x="651" y="348" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">아님</text>
  <rect x="890" y="185" width="255" height="205" rx="22" fill="#fce7ef" stroke="#c0577a" stroke-width="2"/>
  <text x="925" y="238" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#923b5a">4. 임시 권고</text>
  <text x="925" y="280" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">국가별 위험 범주와</text>
  <text x="925" y="316" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">3개월 연장 권고</text>
  <text x="925" y="348" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="19" fill="#1f3548">실행은 각국 몫</text>
  <rect x="90" y="465" width="1020" height="72" rx="14" fill="#eef3f8"/>
  <text x="128" y="510" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#264653">주의: PHEIC는 국제 공중보건 위험에 대한 IHR 판단이며, 특정 지역의 개인 위험이나 최신 사례 수를 자동으로 뜻하지 않는다.</text>
  <text x="70" y="583" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="17" fill="#587087">정확성 한계: 2026년 8월 25일 WHO 성명의 정보 구조를 요약한 그림이다. 최신 여행 보건 요건은 해당 국가의 공식 안내를 확인해야 한다.</text>
</svg>
