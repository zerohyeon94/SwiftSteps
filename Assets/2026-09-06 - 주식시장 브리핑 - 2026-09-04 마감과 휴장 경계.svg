<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">2026년 9월 4일 한미 시장 마감과 주말 이후 확인 경계</title><desc id="desc">한국과 미국의 9월 4일 지수 등락률, 9월 5일 주말 사건, 9월 7일 미국 휴장을 연결하되 인과나 예측을 표시하지 않는 도식</desc>
  <rect width="1440" height="860" fill="#0B0F14"/><g font-family="-apple-system, BlinkMacSystemFont, sans-serif"><text x="70" y="82" fill="#F1F5F9" font-size="35" font-weight="700">9월 4일 마감값과 다음 확인 시점</text><text x="70" y="118" fill="#A5B4C7" font-size="20">정규장 마감 · 주말 지정학 뉴스 · 미국 휴장을 서로 다른 정보로 분리</text>
  <rect x="64" y="170" width="826" height="510" rx="24" fill="#151B23" stroke="#334155" stroke-width="2"/><text x="108" y="226" fill="#E5E7EB" font-size="25" font-weight="700">9/4 정규장 일간 등락률</text><line x1="214" y1="593" x2="804" y2="593" stroke="#64748B" stroke-width="2"/><text x="126" y="596" fill="#94A3B8" font-size="18">0%</text>
  <rect x="282" y="429" width="84" height="164" rx="10" fill="#0EA5E9"/><text x="324" y="410" fill="#BAE6FD" font-size="24" font-weight="700" text-anchor="middle">+1.64%</text><text x="324" y="632" fill="#E5E7EB" font-size="20" text-anchor="middle">KOSPI</text><rect x="424" y="297" width="84" height="296" rx="10" fill="#14B8A6"/><text x="466" y="278" fill="#99F6E4" font-size="24" font-weight="700" text-anchor="middle">+2.95%</text><text x="466" y="632" fill="#E5E7EB" font-size="20" text-anchor="middle">KOSDAQ</text>
  <rect x="566" y="593" width="84" height="40" rx="10" fill="#F97316"/><text x="608" y="666" fill="#FDBA74" font-size="24" font-weight="700" text-anchor="middle">−0.4%</text><text x="608" y="704" fill="#E5E7EB" font-size="20" text-anchor="middle">S&amp;P 500</text><rect x="708" y="593" width="84" height="50" rx="10" fill="#FB7185"/><text x="750" y="676" fill="#FDA4AF" font-size="24" font-weight="700" text-anchor="middle">−0.5%</text><text x="750" y="714" fill="#E5E7EB" font-size="20" text-anchor="middle">Dow</text>
  <rect x="942" y="170" width="434" height="510" rx="24" fill="#151B23" stroke="#334155" stroke-width="2"/><text x="982" y="226" fill="#FBBF24" font-size="25" font-weight="700">시간 순서</text><circle cx="1000" cy="300" r="11" fill="#38BDF8"/><text x="1034" y="307" fill="#E5E7EB" font-size="22">9/4 한·미 정규장 마감</text><line x1="1000" y1="323" x2="1000" y2="393" stroke="#64748B" stroke-width="3"/><circle cx="1000" cy="416" r="11" fill="#F59E0B"/><text x="1034" y="408" fill="#E5E7EB" font-size="22">9/5 주말 지정학 보도</text><text x="1034" y="439" fill="#94A3B8" font-size="18">유가 종가를 이 그림에 추정하지 않음</text><line x1="1000" y1="440" x2="1000" y2="510" stroke="#64748B" stroke-width="3"/><circle cx="1000" cy="533" r="11" fill="#A78BFA"/><text x="1034" y="525" fill="#E5E7EB" font-size="22">9/7 미국 Labor Day 휴장</text><text x="1034" y="556" fill="#94A3B8" font-size="18">다음 미국 현물장 반응은 미확정</text>
  <rect x="64" y="734" width="1312" height="76" rx="18" fill="#1F2937"/><text x="96" y="781" fill="#CBD5E1" font-size="20">정규장 일간 등락률만 표시: 장 마감·지수 구성·주말 뉴스가 달라 다음 거래일 예측 근거가 아니다.</text></g>
</svg>
