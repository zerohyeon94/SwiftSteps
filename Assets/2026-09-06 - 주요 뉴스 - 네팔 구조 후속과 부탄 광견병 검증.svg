<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">네팔 홍수 구조 후속과 부탄 광견병 검증의 정보 단계</title><desc id="desc">네팔 홍수의 초기 대응 이후 구조 후속과 부탄의 개 매개 인간 광견병 제거 검증을 사실과 미확정으로 구분하는 개념도</desc>
  <rect width="1440" height="860" fill="#0B0F14"/><g font-family="-apple-system, BlinkMacSystemFont, sans-serif"><text x="72" y="86" fill="#F1F5F9" font-size="35" font-weight="700">서로 다른 두 뉴스, 서로 다른 확인 단위</text><text x="72" y="122" fill="#A5B4C7" font-size="20">재난의 ‘후속 변화’와 보건 성과의 ‘검증 범위’를 같은 방식으로 단정하지 않기</text>
  <rect x="64" y="174" width="630" height="568" rx="26" fill="#151B23" stroke="#334155" stroke-width="2"/><text x="106" y="232" fill="#93C5FD" font-size="28" font-weight="700">네팔 홍수: 후속 변화</text><line x1="178" y1="330" x2="578" y2="330" stroke="#3B82F6" stroke-width="5"/><circle cx="178" cy="330" r="17" fill="#3B82F6"/><circle cx="378" cy="330" r="17" fill="#38BDF8"/><circle cx="578" cy="330" r="17" fill="#2DD4BF"/>
  <text x="178" y="382" fill="#CBD5E1" font-size="20" text-anchor="middle">8/26</text><text x="178" y="412" fill="#F1F5F9" font-size="22" text-anchor="middle">홍수 발생</text><text x="378" y="382" fill="#CBD5E1" font-size="20" text-anchor="middle">8/31</text><text x="378" y="412" fill="#F1F5F9" font-size="22" text-anchor="middle">초기 보건 대응</text><text x="578" y="382" fill="#CBD5E1" font-size="20" text-anchor="middle">9/5</text><text x="578" y="412" fill="#F1F5F9" font-size="22" text-anchor="middle">터널 구조 후속</text>
  <rect x="108" y="468" width="542" height="94" rx="16" fill="#172554"/><text x="136" y="506" fill="#BFDBFE" font-size="20" font-weight="700">확인된 범위</text><text x="136" y="538" fill="#E5E7EB" font-size="21">구조 활동이 계속되고, 생존자 구조가 보도됨</text><rect x="108" y="588" width="542" height="108" rx="16" fill="#3F2A13"/><text x="136" y="626" fill="#FCD34D" font-size="20" font-weight="700">아직 미확정</text><text x="136" y="658" fill="#E5E7EB" font-size="21">최종 피해·실종자 집계·재난 원인·복구 결과</text>
  <rect x="746" y="174" width="630" height="568" rx="26" fill="#151B23" stroke="#334155" stroke-width="2"/><text x="788" y="232" fill="#A78BFA" font-size="28" font-weight="700">부탄 광견병: 검증의 범위</text><rect x="790" y="286" width="540" height="84" rx="16" fill="#312E81"/><text x="820" y="338" fill="#EDE9FE" font-size="25" font-weight="700">개 백신 접종 + 노출 뒤 예방 + 감시</text><path d="M1060 390 L1060 442" stroke="#A78BFA" stroke-width="5"/><path d="M1044 428 L1060 446 L1076 428" fill="none" stroke="#A78BFA" stroke-width="5"/><rect x="790" y="458" width="540" height="104" rx="16" fill="#2E1065"/><text x="820" y="498" fill="#DDD6FE" font-size="20" font-weight="700">WHO 검증</text><text x="820" y="532" fill="#F1F5F9" font-size="22">개 매개 인간 광견병 ‘공중보건 문제’ 제거</text><rect x="790" y="588" width="540" height="108" rx="16" fill="#3F2A13"/><text x="820" y="626" fill="#FCD34D" font-size="20" font-weight="700">말할 수 없는 것</text><text x="820" y="658" fill="#E5E7EB" font-size="21">모든 위험·동물 감염이 사라졌다는 자동 결론</text><text x="720" y="805" fill="#94A3B8" font-size="21" text-anchor="middle">사실 · 기관 발표 · 아직 미확정인 결과를 분리해 읽는 개념도</text></g>
</svg>
