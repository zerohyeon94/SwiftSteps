<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Go 1.27 제네릭 메서드와 인터페이스 경계</title>
  <desc id="desc">구체 타입의 제네릭 메서드는 가능하지만 제네릭 인터페이스 메서드는 여전히 불가능함을 비교한다.</desc>
  <rect width="1200" height="650" fill="#F8FAFC"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0F172A">Go 1.27: 가능한 제네릭 메서드와 경계</text>
  <rect x="70" y="130" width="500" height="390" rx="24" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="320" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#065F46">가능: 구체 타입의 메서드</text>
  <rect x="135" y="230" width="370" height="78" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="320" y="263" text-anchor="middle" font-family="monospace" font-size="20" fill="#064E3B">type List[E any] struct { ... }</text>
  <text x="320" y="293" text-anchor="middle" font-family="monospace" font-size="19" fill="#064E3B">func (l List[E]) Map[R any](...) List[R]</text>
  <path d="M320 308 L320 355" fill="none" stroke="#10B981" stroke-width="4"/>
  <rect x="155" y="355" width="330" height="98" rx="14" fill="#D1FAE5"/>
  <text x="320" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#065F46">새 타입 매개변수 R로 변환</text>
  <text x="320" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#065F46">구체 타입 API에서 표현 가능</text>
  <rect x="630" y="130" width="500" height="390" rx="24" fill="#FEF2F2" stroke="#F87171" stroke-width="3"/>
  <text x="880" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#991B1B">불가: 인터페이스의 제네릭 메서드</text>
  <rect x="695" y="230" width="370" height="94" rx="14" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
  <text x="880" y="266" text-anchor="middle" font-family="monospace" font-size="20" fill="#7F1D1D">type Mapper interface {</text>
  <text x="880" y="294" text-anchor="middle" font-family="monospace" font-size="20" fill="#7F1D1D">  Map[R any](...) R</text>
  <text x="880" y="322" text-anchor="middle" font-family="monospace" font-size="20" fill="#7F1D1D">}</text>
  <path d="M880 335 L880 370" fill="none" stroke="#EF4444" stroke-width="4"/>
  <rect x="715" y="370" width="330" height="83" rx="14" fill="#FEE2E2"/>
  <text x="880" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991B1B">Go 1.27에서도 지원하지 않음</text>
  <text x="880" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991B1B">인터페이스 계약을 별도로 설계</text>
  <rect x="150" y="555" width="900" height="52" rx="14" fill="#E0E7FF"/>
  <text x="600" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#3730A3">설계 질문: 새 타입 매개변수가 필요한가? · 인터페이스 경계를 넘는 공통 계약인가?</text>
</svg>
